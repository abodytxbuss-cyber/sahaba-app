<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c15"><meta name="description" content="سحابة، رحلتك إلى عوالم السينما. اكتشف الأفلام والمسلسلات وابنِ مكتبتك عبر إضافات Stremio.">
  <title>سحابة — لكل حكاية سماء</title>
  <link rel="icon" href="assets/cloud.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="night" aria-hidden="true"><div class="stars"></div><div class="aurora"></div></div>
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="سحابة، الرئيسية"><img src="assets/cloud.svg" alt=""><span>سحابة<small>لِكُلّ حكايةٍ سماء</small></span></a>
    <nav aria-label="التنقل الرئيسي">
      <a href="#/home" data-route="home">الرئيسية</a><a href="#/journey" data-route="journey">رحلتي</a><a href="#/search" data-route="search">اكتشف</a><a href="#/library" data-route="library">مكتبتي</a><a href="#/addons" data-route="addons">إضافاتي</a>
    </nav>
    <button id="xp-button" class="xp-button" aria-label="نقاط الخبرة والإنجازات"><span class="gold">✧</span><b id="xp-value">0 XP</b><span class="avatar">س</span></button>
  </header>
  <div id="connection" class="connection" role="status" hidden>أنت غير متصل. محتواك المحفوظ ما زال هنا. <button data-action="retry">إعادة المحاولة</button></div>
  <main id="main" tabindex="-1"><div class="boot"><img src="assets/cloud.svg" alt=""><h1>تتهيّأ سماؤك…</h1><div class="skeleton"></div><button onclick="location.reload()">إعادة المحاولة</button></div></main>
  <footer><a class="footer-brand" href="#/home">☁ سحابة</a><span>حكاية جديدة، نجمة جديدة.</span><a href="#/addons">مصادرك، باختيارك</a></footer>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="إغلاق">×</button></div><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="empty">فعّل JavaScript لتبدأ رحلتك في سحابة.</div></noscript>
  <script type="module" src="app.js"></script>
</body></html>
